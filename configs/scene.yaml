# Native occupancy adapter currently requires Z-up/metres and authored colliders.
occupancy:
  resolution: 0.1
  origin: [0.0, 0.0, 0.3]  # Free scan origin; Z is the sampled collision height.
  # Native omap bounds are offsets relative to origin, not absolute world XYZ.
  lower_bound: [-4.5, -4.5, 0.0]
  upper_bound: [4.5, 4.5, 0.0]
  floor_z: 0.0
  agent_radius: 0.28

